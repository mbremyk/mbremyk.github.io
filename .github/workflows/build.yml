# With some help from: https://gist.github.com/dgerosa/2e1f47a39180f39bde848e38243efa94

name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: ./CV
      FILE: cv
    steps:
      - name: Set up Git repository
        uses: actions/checkout@latest
      - name: cv
        uses: dante-ev/latex-action@latest
        with:
          root_file: ${{ env.FILE }}
          working_directory: ${{ env.DIR }}
      - name: move
        run: mkdir -p github_artifacts/CV && mv ${{ env.DIR }}/${{ env.FILE }}.pdf ./github_artifacts/CV
      - name: Upload pdf as artifact
        uses: actions/upload-artifact@latest
        with:
          name: ${{ env.FILE }}.pdf
          path: ./github_artifacts
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@latest
      - uses: actions/download-artifact@latest
        with:
          path: github_artifacts
      - name: move
        run: mkdir -p github_deploy && mv github_artifacts/*/* github_deploy
      - name: deploy on orphan branch
        uses: peaceiris/actions-gh-pages@latest
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true
  copy-index-to-build:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@latest
        with:
          fetch-depth: 0
      - name: Copy To Branches Action
        uses: planetoftheweb/copy-to-branches@latest
        env:
          key: trunk
          files: index.html rng.js ./CV/index.html ./CV/CNAME fluidSimulation/* shift_cipher/* train/* waveFunctionCollapse/* buton_helper/*
